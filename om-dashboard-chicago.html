<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OM · Chicago Dental Boutique</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f4f0;--white:#fff;--border:#e2e0d9;--text:#1a1917;--muted:#6b6963;
  --accent:#185FA5;--accent-bg:#e6f1fb;--accent-border:rgba(24,95,165,.2);
  --red:#E24B4A;--red-lt:#fcebeb;--amber:#BA7517;--amber-lt:#faeeda;--blue:#185FA5;--blue-lt:#e6f1fb;
  --teal:#1D9E75;--radius:10px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;min-height:100vh}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lmsg{font-size:14px;font-weight:500}.lsub{font-size:12px;color:var(--muted)}
.lbar-wrap{width:260px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.lbar{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%}
#main{display:none}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:.7rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-l{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.top-name{font-size:15px;font-weight:700;letter-spacing:-.02em}
.top-badge{font-size:11px;color:var(--accent);background:var(--accent-bg);padding:2px 9px;border-radius:20px;border:1px solid var(--accent-border)}
.top-r{display:flex;align-items:center;gap:7px}
.bsm{padding:.35rem .8rem;border:1px solid var(--border);border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;background:var(--white);font-family:inherit;color:var(--text)}
.bsm:hover{background:var(--bg)}
.bacc{background:var(--accent);color:#fff;border-color:var(--accent)}.bacc:hover{opacity:.9;background:var(--accent)}
.tstatus{font-size:11px;color:var(--muted)}
.date-row{display:flex;align-items:center;gap:6px}
.date-input{padding:.3rem .6rem;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:var(--white);color:var(--text)}
.nav{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;overflow-x:auto}
.nav-btn{padding:.85rem 1.2rem;border:none;background:none;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit}
.nav-btn:hover{color:var(--text)}.nav-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.view{display:none;padding:1.5rem}.view.active{display:block}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.25rem}
.kcard{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem}
.kcard.acc{background:var(--accent-bg);border-color:var(--accent-border)}
.kval{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1}
.klbl{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.ksub{font-size:11px;color:var(--muted);margin-top:2px}
.crow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1.25rem}
.ccard{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.ccard h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
.csub{font-size:10px;color:var(--muted);margin-bottom:.5rem}
.cwrap{position:relative;height:160px}
.calls-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.calls-hdr{padding:.75rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.calls-hdr h3{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.fp{display:flex;gap:6px}
.pill{font-size:11px;padding:.3rem .7rem;border:1px solid var(--border);border-radius:20px;cursor:pointer;background:var(--white);color:var(--muted);font-family:inherit}
.pill.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.ccols{display:grid;grid-template-columns:90px 1fr 110px 70px 80px 90px 28px;gap:8px;padding:.5rem 1rem;background:var(--bg);border-bottom:1px solid var(--border);font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.crow2{border-bottom:1px solid var(--border)}.crow2:last-child{border-bottom:none}
.chd{display:grid;grid-template-columns:90px 1fr 110px 70px 80px 90px 28px;gap:8px;padding:.75rem 1rem;cursor:pointer;align-items:center}
.chd:hover{background:var(--bg)}
.cdt{font-size:11px;color:var(--muted)}
.cname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
.slsa{background:var(--blue-lt);color:var(--blue)}.sads{background:var(--amber-lt);color:var(--amber)}
.ab{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.ayes{background:#eaf3de;color:#3b6d11}.ano{background:var(--red-lt);color:#a32d2d}
.exp{font-size:13px;color:var(--muted);transition:transform .15s;text-align:center}
.crow2.open .exp{transform:rotate(180deg)}
.cdet{display:none;padding:1rem;background:var(--bg);border-top:1px solid var(--border)}
.crow2.open .cdet{display:block}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.dbox{background:var(--white);border:1px solid var(--border);border-radius:7px;padding:.7rem .9rem}
.dlbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.dtxt{font-size:12px;color:var(--muted);line-height:1.6}
.sbox{background:var(--white);border:1px solid var(--border);border-radius:7px;padding:.7rem .9rem;margin-bottom:8px}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}
.acell{background:var(--white);border:1px solid var(--border);border-radius:7px;padding:.5rem .75rem}
.albl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.aval{font-size:12px;font-weight:600}
.sbarw{display:flex;align-items:center;gap:7px;margin-top:3px}
.sbart{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.sbarf{height:100%;border-radius:2px}
.obox{background:var(--amber-lt);border:1px solid rgba(186,117,23,.2);border-radius:7px;padding:.7rem .9rem;margin-top:8px}
.olbl{font-size:10px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.drvbox{border-radius:7px;padding:.7rem .9rem;margin-top:8px;border-left:3px solid}
.banal{margin-top:8px;padding:.35rem .8rem;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.aia{font-size:12px;color:var(--muted);font-style:italic;padding:.5rem 0;display:flex;align-items:center;gap:7px}
.mspin{width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
.opslist{display:flex;flex-direction:column;gap:10px}
.opsc{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;display:flex;gap:12px}
.empt{padding:3rem;text-align:center;color:var(--muted);font-size:13px}
#progBanner{position:fixed;bottom:0;left:0;right:0;background:#1a1917;color:#fff;padding:.6rem 1.5rem;display:flex;align-items:center;justify-content:space-between;z-index:999;font-size:12px;font-family:inherit;display:none}
@media(max-width:900px){.kgrid,.crow{grid-template-columns:repeat(2,1fr)}}

@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff !important; font-size: 11px; }
  .topbar { position: relative !important; background: #1a1917 !important; padding: .5rem 1rem; }
  .top-right { display: none !important; }
  .nav { display: none !important; }
  #progBanner { display: none !important; }
  .call-card-css-print { display: none; }
  /* Show only the active view */
  .view { display: none !important; }
  .view.active { display: block !important; padding: .5rem !important; }
  /* KPI grid */
  .kgrid { grid-template-columns: repeat(5,1fr) !important; gap: 6px !important; margin-bottom: .75rem !important; }
  .kcard { padding: .6rem .75rem !important; border: 1px solid #e2e0d9 !important; }
  .kval { font-size: 20px !important; }
  /* Charts */
  .crow { gap: 6px !important; margin-bottom: .75rem !important; }
  .ccard { padding: .6rem .75rem !important; }
  .cwrap { height: 130px !important; }
  /* Call cards */
  .call-card { break-inside: avoid; margin-bottom: 10px !important; border: 1px solid #ddd !important; }
  .cbody, .call-card-body { grid-template-columns: 160px 1fr !important; }
  .analyze-bar { display: none !important; }
  .ccols { display: none !important; }
  /* Ops cards */
  .opsc, .opscard { break-inside: avoid; }
  /* Filter pills hidden */
  .fp, .frow { display: none !important; }
  /* Page breaks */
  .kgrid { page-break-after: avoid; }
  h2, h3 { page-break-after: avoid; }
}


.pdf-btn {
  background: #1a1917;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: .35rem .9rem;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 5px;
}
.pdf-btn:hover { opacity: .85; }

</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="lmsg" id="lmsg">Loading Chicago Dental Boutique...</div>
  <div class="lsub" id="lsub">Fetching Google Ads + LSA calls</div>
  <div class="lbar-wrap"><div class="lbar" id="lbar"></div></div>
</div>

<div id="main">
  <div class="topbar">
    <div class="top-l">
      <div class="dot"></div>
      <div class="top-name">Chicago Dental Boutique</div>
      <div class="top-badge">Chicago</div>
    </div>
    <div class="top-r">
      <span class="tstatus" id="ts"></span>
      <div class="date-row">
        <input id="dateFrom" class="date-input" type="date">
        <span style="color:var(--muted)">to</span>
        <input id="dateTo" class="date-input" type="date">
        <button class="bsm" onclick="refreshDash()">Refresh</button>
      </div>
      <button class="bsm bacc" id="analyzeBtn" onclick="analyzeAll()">+ Analyze all</button>
      <button class="pdf-btn" onclick="savePDF()">&#128424; Save as PDF</button>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="showView('overview',this)">Overview</button>
    <button class="nav-btn" onclick="showView('calls',this)">Call Log</button>
    <button class="nav-btn" onclick="showView('ops',this)">Opportunities</button>
  </div>

  <div id="view-overview" class="view active">
    <div class="kgrid" id="kstrip"></div>
    <div class="crow" id="cr1"></div>
    <div class="crow" id="cr2"></div>
  </div>

  <div id="view-calls" class="view">
    <div class="calls-card">
      <div class="calls-hdr">
        <h3>Call log <span id="ccount" style="font-weight:400;color:var(--muted)"></span></h3>
        <div class="fp">
          <span class="pill active" onclick="setF('all',this)">All</span>
          <span class="pill" onclick="setF('booked',this)">Booked</span>
          <span class="pill" onclick="setF('lost',this)">Not Booked</span>
          <span class="pill" onclick="setF('lsa',this)">LSA</span>
          <span class="pill" onclick="setF('ads',this)">Ads</span>
        </div>
      </div>
      
      <div id="clist"></div>
    </div>
  </div>

  <div id="view-ops" class="view">
    <div class="kgrid" id="okstrip"></div>
    <div class="opslist" id="opslist"></div>
  </div>
</div>

<div id="progBanner"></div>

<script>
// ── CONFIG (hardcoded) ───────────────────────────────────────────────────────
var ACCOUNT_ID   = '561967665';
var COMPANY_ID   = 'COM4769347682924b7b825670ff4b7500f2';
var COMPANY_NAME = 'Chicago Dental Boutique';
var CR_KEY       = '5364449f9699a326e75f59db01001423';

// ── STATE ────────────────────────────────────────────────────────────────────
var calls = [], cache = {}, activeF = 'all', ch = {};

// ── DATES (default last 30 days) ──────────────────────────────────────────────
(function(){
  var now   = new Date();
  var first = new Date(now.getFullYear(), now.getMonth(), 1);
  var pad   = function(n){ return String(n).padStart(2,'0'); };
  var fmt   = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
  document.getElementById('dateFrom').value = fmt(first);
  document.getElementById('dateTo').value   = fmt(now);
})();

// ── CALLRAIL ─────────────────────────────────────────────────────────────────
function setLoad(m,p,s){
  document.getElementById('lmsg').textContent = m;
  document.getElementById('lsub').textContent = s || '';
  document.getElementById('lbar').style.width  = p + '%';
}

async function crFetch(path, qs){
  var url = 'https://api.callrail.com/v3/' + path;
  if(qs){
    var params = Object.keys(qs).map(function(k){
      return encodeURIComponent(k) + '=' + encodeURIComponent(qs[k]);
    }).join('&');
    url += '?' + params;
  }
  var r = await fetch(url, {headers:{Authorization:'Token token=' + CR_KEY}});
  if(!r.ok) throw new Error('CallRail ' + r.status + ': ' + (await r.text()).slice(0,200));
  return r.json();
}

// ── CONFIRMED VALID CALLRAIL FIELDS (do not add without testing) ──────────────
// VALID: answered,call_type,duration,start_time,customer_name,customer_phone_number,
//        customer_city,customer_state,first_call,source_name,note,voicemail,
//        lead_explanation,lead_score
// INVALID (cause 400): summary,caller_name,transcription,direction
// DATE PARAMS: start_date / end_date  (NOT date_range[start])

async function loadCalls(){
  var from = document.getElementById('dateFrom').value;
  var to   = document.getElementById('dateTo').value;
  setLoad('Fetching calls...', 30, COMPANY_NAME + ' · Google Ads + LSA');
  var data = await crFetch('a/' + ACCOUNT_ID + '/calls.json', {
    company_id: COMPANY_ID,
    start_date: from, end_date: to,
    per_page: 250, sort: 'start_time', order: 'desc',
    fields: 'answered,call_type,duration,start_time,customer_name,customer_phone_number,customer_city,customer_state,first_call,source_name,note,voicemail,lead_explanation,lead_score,recording'
  });
  var all = data.calls || [];
  // Filter to Google sources only
  calls = all.filter(function(c){
    return (c.source_name || '').toLowerCase().includes('google');
  });
  // Map lead_explanation -> _txt (primary content for analysis)
  calls.forEach(function(c){ c._txt = c.lead_explanation || c.note || ''; });
  setLoad(calls.length + ' Google calls loaded', 80, from + ' → ' + to);
  document.getElementById('ts').textContent = calls.length + ' calls · ' + from + ' → ' + to;
}

// ── ANALYSIS ──────────────────────────────────────────────────────────────────






// ── ASSEMBLYAI TRANSCRIPT ENRICHMENT ─────────────────────────────────────
// Each call transcribed once, cached in localStorage — no repeat billing.

var AAI_KEY = '4fff70fb028b4001820af3adacc6a9a4'; localStorage.setItem('aai_key', AAI_KEY);

function cachedTx(id)     { try{ return localStorage.getItem('tx:'+id)||null; }catch(e){ return null; } }
function cacheTx(id, txt) { try{ localStorage.setItem('tx:'+id, txt); }catch(e){} }

function showKeyPanel() {
  var existing = document.getElementById('aai-panel');
  if(existing){ existing.style.display='flex'; return; }
  var panel = document.createElement('div');
  panel.id = 'aai-panel';
  panel.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid #e2e0d9;'+
    'border-radius:10px;padding:1rem;z-index:300;box-shadow:0 4px 20px rgba(0,0,0,.15);'+
    'display:flex;flex-direction:column;gap:8px;width:340px;font-family:sans-serif';
  panel.innerHTML =
    '<div style="font-size:13px;font-weight:700">🎙 Enable Call Transcripts</div>'+
    '<div style="font-size:11px;color:#6b6963">Paste your AssemblyAI API key below.<br>'+
    'Free at <a href="https://assemblyai.com" target="_blank">assemblyai.com</a> · 5 hrs/month free · each call transcribed once</div>'+
    '<input id="aai-input" type="password" placeholder="e.g. 5f3a2b..." style="'+
    'padding:.5rem .8rem;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:monospace">'+
    '<div style="display:flex;gap:8px">'+
    '<button id="aai-save" style="flex:1;padding:.45rem;background:#185FA5;color:#fff;border:none;'+
    'border-radius:6px;cursor:pointer;font-size:12px">Save &amp; Transcribe</button>'+
    '<button onclick="document.getElementById(\'aai-panel\').style.display=\'none\'" '+
    'style="padding:.45rem .8rem;background:#f0efe9;border:none;border-radius:6px;cursor:pointer;font-size:12px">Later</button>'+
    '</div>';
  document.body.appendChild(panel);
  document.getElementById('aai-save').onclick = function(){
    var k = document.getElementById('aai-input').value.trim();
    if(!k){ alert('Please enter your AssemblyAI API key.'); return; }
    AAI_KEY = k;
    localStorage.setItem('aai_key', AAI_KEY);
    panel.style.display = 'none';
    enrichTranscripts(calls);
  };
}

async function getSignedUrl(call) {
  try {
    var r = await fetch(call.recording, {headers:{Authorization:'Token token='+CR_KEY}});
    if(!r.ok) return null;
    var d = await r.json();
    return d.url || d.download_url || null;
  } catch(e){ return null; }
}

async function aaiTranscribe(mp3Url) {
  try {
    var r1 = await fetch('https://api.assemblyai.com/v2/transcript', {
      method:'POST',
      headers:{Authorization: AAI_KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({audio_url: mp3Url, language_code:'en'})
    });
    if(!r1.ok) return null;
    var job = await r1.json();
    if(!job.id) return null;
    for(var i=0; i<30; i++){
      await new Promise(function(r){ setTimeout(r, 3000); });
      var rp = await fetch('https://api.assemblyai.com/v2/transcript/'+job.id,
                           {headers:{Authorization: AAI_KEY}});
      if(!rp.ok) continue;
      var pd = await rp.json();
      if(pd.status === 'completed') return pd.text || null;
      if(pd.status === 'error')     return null;
    }
  } catch(e){}
  return null;
}

async function enrichTranscripts(callList) {
  // Load any cached transcripts immediately (free, no API call)
  var didCache = false;
  callList.forEach(function(c){
    var tx = cachedTx(c.id);
    if(tx){
      c._txt = tx; c._transcribed = true;
      var txEl = document.getElementById('tx-'+c.id);
      if(txEl){
        txEl.style.background=''; txEl.style.opacity='1';
        txEl.innerHTML = '<div class="txlbl">Call transcript</div>'+
                         '<div class="txtext">'+tx+'</div>';
      }
      didCache = true;
    }
  });
  if(didCache){
    callList.filter(function(c){ return cache[c.id]&&c._transcribed; })
            .forEach(function(c){ cache[c.id]=analyzeLocally(c); });
    render();
  }

  // Check which calls still need transcribing
  var toProcess = callList.filter(function(c){
    return c.answered && c.recording && !cachedTx(c.id);
  });
  if(!toProcess.length) return;

  // Key hardcoded — always proceed

  // Progress indicator
  var progEl = document.getElementById('tx-prog');
  if(!progEl){
    progEl = document.createElement('div');
    progEl.id = 'tx-prog';
    progEl.style.cssText = 'position:fixed;top:52px;right:12px;background:#1a1917;color:#fff;'+
      'padding:.5rem 1rem;border-radius:6px;font-size:11px;z-index:200;display:flex;align-items:center;gap:8px';
    document.body.appendChild(progEl);
  }

  for(var i=0; i<toProcess.length; i+=3){
    var batch = toProcess.slice(i, i+3);
    progEl.innerHTML = '<div class="mspin"></div>Transcribing '+(i+1)+
      '–'+Math.min(i+3,toProcess.length)+' / '+toProcess.length;
    await Promise.all(batch.map(async function(c){
      try {
        var mp3 = await getSignedUrl(c);
        if(!mp3) return;
        var tx = await aaiTranscribe(mp3);
        if(!tx) return;
        c._txt=tx; c._transcribed=true;
        cacheTx(c.id, tx);
        var txEl = document.getElementById('tx-'+c.id);
        if(txEl){
          txEl.style.background=''; txEl.style.opacity='1';
          txEl.innerHTML='<div class="txlbl">Call transcript</div><div class="txtext">'+tx+'</div>';
        }
        cache[c.id] = analyzeLocally(c);
      } catch(e){}
    }));
    if(i+3 < toProcess.length) await new Promise(function(r){ setTimeout(r,500); });
  }
  if(progEl) progEl.remove();
  render();
}


// ═══════════════════════════════════════════════════════════════════════════
//  LOCAL CALL ANALYZER v4
//
//  SOURCE OF TRUTH HIERARCHY:
//  1. call._txt (lead_explanation / call summary) — PRIMARY for all decisions
//  2. call.duration + call.answered — SECONDARY (objective call facts only)
//
//  EXPLICITLY NOT USED as decision signals:
//  - call.lead_score   (CallRail's proprietary score — their opinion, not ours)
//  - call.first_call   (CallRail tag)
//  - call.tags         (CallRail tags)
//  - Any X/25 scores from lead_explanation (CallRail scoring, not call content)
//
//  When no summary is available, analysis is marked low-confidence.
// ═══════════════════════════════════════════════════════════════════════════
function analyzeLocally(call) {
  var raw = call._txt || '';
  var txt = raw.toLowerCase();
  var dur = call.duration || 0;
  var hasText = raw.trim().length > 30;

  // ── OUTCOME — read from summary text only ────────────────────────────────
  var outcome = 'Not Booked';

  if (!call.answered) {
    outcome = 'Missed / No Answer';
  } else if (!hasText) {
    // No summary — use duration as weak signal only
    outcome = dur < 30 ? 'Missed / No Answer' : 'Not Booked';
  } else {
    // Booking confirmed — look for explicit scheduling language in the summary
    var bookPats = [
      /scheduled\s+(him|her|them|the\s+(patient|caller)|a|an)\s+(for|at|on)/i,
      /appointment\s+(was\s+)?(booked|scheduled|confirmed|set\s+up)/i,
      /booked\s+(the\s+patient\s+)?(for|an|a|the)/i,
      /confirmed\s+(for|an?\s+appointment|the\s+appointment)/i,
      /set\s+(up\s+)?(an?\s+)?appointment\s+(for|on|at)/i,
      /will\s+(come|see\s+the\s+doctor|visit)\s+(in|the\s+office|on)/i,
      /coming\s+in\s+(on|at|for)\s+/i,
      /see\s+you\s+(on|at|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday)/i,
      /appointment\s+(on|at)\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday|\d)/i,
      /appointment\s+.*\d{1,2}:\d{2}/i,
      /\d{1,2}:\d{2}\s*(am|pm)\s+appointment/i,
      /successfully\s+(scheduled|booked)/i,
      /patient\s+was\s+(scheduled|booked)/i,
      /caller\s+was\s+(scheduled|booked)/i,
      /new\s+appointment\s+(was\s+)?(made|created|set)/i,
      /slot\s+(was\s+)?reserved/i,
      /will\s+be\s+seen\s+(on|at|tomorrow)/i,
      /is\s+(scheduled|booked|set)\s+(to\s+come\s+in|for)/i,
    ];
    for (var i = 0; i < bookPats.length; i++) {
      if (bookPats[i].test(raw)) { outcome = 'New Appointment Booked'; break; }
    }

    // Other outcomes — only from text
    if (outcome === 'Not Booked') {
      if (/rescheduled.*to|reschedule.*appointment|appointment.*moved.*to/i.test(txt)) outcome = 'Rescheduled';
      else if (/confirm.*existing|existing.*appointment|confirm.*scheduled.*visit/i.test(txt)) outcome = 'Confirmed Existing';
      else if (/referred.*to\s+(a\s+)?(specialist|oral surgeon|endodontist|periodontist|another)/i.test(txt)) outcome = 'Referred Out';
      else if (/cancel.*appointment|appointment.*was.*cancelled/i.test(txt)) outcome = 'Cancelled';
    }
  }

  // ── PROCEDURE — from summary text only ───────────────────────────────────
  var procedure = 'Unknown';
  if (hasText) {
    var procs = [
      ['Root Canal',          /root\s*canal|endodont/i],
      ['Extraction',          /extract|pull\s+(a\s+)?tooth|remove\s+(a\s+)?tooth|tooth.*remov/i],
      ['Implant',             /implant/i],
      ['Wisdom Teeth',        /wisdom/i],
      ['Filling Restoration', /filling|cavity|cavities|restoration/i],
      ['Crown Bridge',        /crown|bridge/i],
      ['Denture Partial',     /denture|partial/i],
      ['Hygiene Cleaning',    /clean|hygiene|prophylaxis/i],
      ['Whitening',           /whitening|bleach/i],
      ['Invisalign',          /invisalign|aligner|braces|orthodont/i],
      ['New Patient Exam',    /new\s+patient|checkup|check.up|routine\s+exam/i],
      ['Emergency Pain',      /pain|emergency|swelling|abscess|broken|chipped|cracked|toothache/i],
      ['Consultation',        /consult|second\s+opinion/i],
    ];
    for (var pi = 0; pi < procs.length; pi++) {
      if (procs[pi][1].test(txt)) { procedure = procs[pi][0]; break; }
    }
  }

  // ── URGENCY — from summary text only ─────────────────────────────────────
  var urgency = 'Normal';
  if (hasText) {
    if (/emergency|severe\s+pain|immediate|abscess|swelling|can.t\s+(eat|sleep|chew)|unbearable/i.test(txt)) urgency = 'Emergency';
    else if (/pain|discomfort|hurting|asap|today|same.?day|urgent|throbbing|sensitive/i.test(txt)) urgency = 'High';
    else if (/no\s+urgency|not\s+urgent|flexible|whenever|no\s+rush|when.*convenient/i.test(txt)) urgency = 'Low';
  } else if (dur < 30) {
    urgency = 'Low'; // very short call, no content to read
  }

  // ── LEAD QUALITY — derived from summary text content only ────────────────
  // Do NOT use call.lead_score — that is CallRail's own computation
  var lead_quality = 'warm'; // default if we can't read text
  var lead_score   = 50;     // internal estimate, NOT from CallRail

  if (hasText) {
    // Build a score from what the text tells us about the caller
    var lScore = 0;

    // Need signals (+)
    if (/specific.*need|inquir.*about|looking\s+for|need.*dental|dental.*need/i.test(txt)) lScore += 20;
    if (procedure !== 'Unknown' && procedure !== 'General Inquiry') lScore += 15;
    if (urgency === 'Emergency') lScore += 25;
    else if (urgency === 'High') lScore += 15;

    // Fit signals (+)
    if (/insurance.*accept|insurance.*in.network|accept.*insurance/i.test(txt)) lScore += 15;
    if (/new\s+patient|first.*call|first.*time/i.test(txt)) lScore += 5;

    // Intent/commitment signals (+)
    if (/ready.*book|want.*appointment|need.*appointment|schedule.*soon/i.test(txt)) lScore += 15;
    if (outcome === 'New Appointment Booked') lScore += 10;
    if (dur >= 180) lScore += 5; // longer call = more engaged

    // Negative signals (-)
    if (/not\s+accept|doesn.t\s+accept|does\s+not\s+accept|medicaid|county\s+care/i.test(txt)) lScore -= 20;
    if (/poor\s+fit|misaligned|not\s+interested|no\s+interest|fundamentally\s+misaligned/i.test(txt)) lScore -= 25;
    if (/wrong\s+number|misdial|unrelated/i.test(txt)) lScore -= 40;
    if (/disengaged|ended.*abruptly|hung\s+up|disconnected/i.test(txt)) lScore -= 10;
    if (dur < 30) lScore -= 20;

    lead_score = Math.max(0, Math.min(100, 40 + lScore)); // base of 40

    if (lead_score >= 65) lead_quality = 'hot';
    else if (lead_score < 30) lead_quality = 'cold';
    else lead_quality = 'warm';
  }

  // ── SENTIMENT — from summary text only ───────────────────────────────────
  var sentiment = 'neutral';
  if (hasText) {
    if (/positive|satisfied|happy|pleased|friendly|grateful|enthusiastic|great\s+experience/i.test(txt)) sentiment = 'positive';
    if (/frustrated|upset|angry|disappointed|rude|dissatisfied|irritated|complain/i.test(txt)) sentiment = 'negative';
  }

  // ── AGENT SCORE — from what summary says agent did ───────────────────────
  // Only metadata used: duration (objective fact) and answered (objective fact)
  var agent_score = 55;
  if (!call.answered) {
    agent_score = 0;
  } else if (!hasText) {
    // No summary — can't assess agent, give neutral score
    agent_score = dur < 30 ? 30 : 50;
  } else {
    // Base score — adjust from what the summary says happened
    agent_score = 50;

    // Positive agent behaviors mentioned in text
    if (outcome === 'New Appointment Booked' || outcome === 'Rescheduled') agent_score += 30;
    if (/confirmed.*insurance|verified.*insurance|insurance.*in.network/i.test(txt)) agent_score += 10;
    if (/offered.*self.pay|offered.*payment\s+plan|alternative.*offered|offered.*financing/i.test(txt)) agent_score += 12;
    if (/agent.*explained|agent.*informed|agent.*provided.*information/i.test(txt)) agent_score += 5;
    if (/agent.*professional|professional.*manner|handled.*well/i.test(txt)) agent_score += 5;
    if (dur >= 180 && outcome === 'New Appointment Booked') agent_score += 5;

    // Negative agent behaviors mentioned in text
    if (/did\s+not\s+offer|no\s+alternative|failed\s+to\s+offer|no\s+attempt/i.test(txt)) agent_score -= 15;
    if (/agent.*rude|unprofessional|poor\s+tone|agent.*abrupt/i.test(txt)) agent_score -= 25;
    if (/agent.*unable|could\s+not\s+help|couldn.t\s+assist/i.test(txt)) agent_score -= 5;

    // Duration signals (objective fact — not a tag)
    if (dur < 30) agent_score -= 25;
    else if (dur < 60 && outcome !== 'New Appointment Booked') agent_score -= 10;

    // Urgency mismatch: urgent caller not served
    if ((urgency === 'Emergency' || urgency === 'High') && outcome !== 'New Appointment Booked') agent_score -= 12;

    agent_score = Math.max(5, Math.min(98, agent_score));
  }

  // ── LOST REASON — from summary text only ─────────────────────────────────
  var lost_reason = null;
  if (outcome !== 'New Appointment Booked' && outcome !== 'Confirmed Existing' && outcome !== 'Rescheduled') {
    if (outcome === 'Missed / No Answer') {
      lost_reason = 'Voicemail No Human';
    } else if (!hasText) {
      lost_reason = dur < 45 ? 'Unclassified Short Call' : 'Other';
    } else if (/insurance.*not.*accept|does\s+not\s+accept|doesn.t\s+accept|not.*take.*insurance|medicaid|county\s+care|not.*covered/i.test(txt)) {
      lost_reason = 'Insurance Not Accepted';
    } else if (/out.*of.*network|out-of-network|not.*in.*network/i.test(txt)) {
      lost_reason = 'Insurance Out Of Network';
    } else if (/no.*availab|not.*availab|couldn.t.*accommodat|could\s+not\s+accommodat|no\s+(open\s+)?slot|no\s+opening/i.test(txt)) {
      lost_reason = 'Schedule No Fit';
    } else if (/too\s+far|location.*far|distance|drive.*far|too.*far\s+to\s+travel/i.test(txt)) {
      lost_reason = 'Schedule No Fit';
    } else if (/will\s+call\s+back|call.*back|think.*about|need\s+to\s+think|consider.*option|not\s+ready/i.test(txt)) {
      lost_reason = 'Callback Needed';
    } else if (/price|cost|expensive|afford|too\s+much|payment\s+concern/i.test(txt)) {
      lost_reason = 'Price Concern';
    } else if (/wrong\s+number|misdial|unrelated|not\s+looking\s+for/i.test(txt)) {
      lost_reason = 'Wrong Number';
    } else if (outcome === 'Referred Out') {
      lost_reason = 'Referred Out';
    } else if (dur < 45 && call.answered) {
      lost_reason = 'Unclassified Short Call';
    } else {
      lost_reason = 'Other';
    }
  }

  // ── FLAG LOGIC — driven by text-derived signals only ─────────────────────
  // No CallRail tags used. All flags come from what the summary tells us.
  var flag_priority = null, ops_opportunity = null, flag_type = null;

  if (outcome !== 'New Appointment Booked' && outcome !== 'Confirmed Existing' && outcome !== 'Rescheduled') {

    // HIGH: Urgent/emergency caller not booked — biggest miss
    if ((urgency === 'Emergency' || urgency === 'High') && outcome === 'Not Booked' && hasText) {
      flag_priority = 'high';
      flag_type = urgency === 'Emergency' ? 'Emergency Patient Not Served' : 'Urgent Lead Lost';
      ops_opportunity = urgency === 'Emergency'
        ? 'Emergency patient left without an appointment. Reserve daily urgent slots and train agents to triage pain calls immediately — these callers will book with the first practice that can see them today.'
        : 'High-urgency caller not booked. Agent should offer the earliest available slot, and if none exist same-day, offer a same-day doctor callback to assess urgency.';
    }

    // HIGH: Warm/hot lead (text signals) not converted
    else if (lead_score > 55 && outcome === 'Not Booked' && hasText
             && lost_reason !== 'Wrong Number' && lost_reason !== 'Voicemail No Human'
             && lost_reason !== 'Insurance Not Accepted' && lost_reason !== 'Insurance Out Of Network') {
      flag_priority = 'high';
      flag_type = 'Warm Lead Not Converted';
      ops_opportunity = 'Patient showed clear interest and dental need but left without an appointment. Coach on assumptive close: "Let me get you set up for [day] at [time] — does that work for you?" rather than asking if they want to schedule.';
    }

    // MEDIUM: Insurance rejected — no recovery attempt mentioned in text
    else if ((lost_reason === 'Insurance Not Accepted' || lost_reason === 'Insurance Out Of Network') && hasText) {
      var offeredAlt = /self.pay|cash\s+price|payment\s+plan|financing|without\s+insurance|out.of.pocket|membership/i.test(txt);
      if (!offeredAlt) {
        flag_priority = 'medium';
        flag_type = 'Insurance Rejection — No Recovery';
        ops_opportunity = 'Summary does not mention offering self-pay pricing or a payment plan after the insurance rejection. A scripted alternative ("We also offer cash pricing starting at $X — would you like to hear more?") can convert 20-30% of these callers.';
      }
    }

    // MEDIUM: Urgent call with no available slot — operational gap
    else if (lost_reason === 'Schedule No Fit' && (urgency === 'Emergency' || urgency === 'High') && hasText) {
      flag_priority = 'medium';
      flag_type = 'No Urgent Availability';
      ops_opportunity = 'Urgent patient could not be accommodated due to scheduling. Reserve 2-3 daily urgent/same-day slots for inbound emergency/pain calls — these are your highest-conversion callers.';
    }

    // MEDIUM: Long call, answered, not booked — agent didn't close
    else if (dur >= 90 && outcome === 'Not Booked' && call.answered && hasText
             && lost_reason !== 'Wrong Number' && lost_reason !== 'Insurance Not Accepted'
             && lost_reason !== 'Insurance Out Of Network') {
      flag_priority = 'medium';
      flag_type = 'Passive Close';
      ops_opportunity = 'Call lasted ' + Math.floor(dur/60) + 'm ' + (dur%60) + 's with no appointment booked — agent engaged but did not close. The summary should mention a booking attempt. Coach on closing: "I have an opening on [day] at [time] — shall I put you down?"';
    }

    // LOW: Caller deferred — no hold secured
    else if (lost_reason === 'Callback Needed' && hasText) {
      flag_priority = 'low';
      flag_type = 'No Appointment Hold Secured';
      ops_opportunity = 'Patient said they would call back. Agent should have offered a tentative appointment hold before ending the call: "Let me hold a spot for you — I can always cancel if you change your mind."';
    }

    // LOW: No summary at all on an answered call — we cannot assess it
    else if (!hasText && call.answered && dur >= 60) {
      flag_priority = 'low';
      flag_type = 'No Summary Available';
      ops_opportunity = 'No call summary was returned by CallRail for this call — outcome and agent performance cannot be assessed. Review the recording directly.';
    }
  }

  // ── SUMMARY ──────────────────────────────────────────────────────────────
  var summary;
  if (!hasText) {
    summary = (call.answered ? 'Call answered' : 'Call missed') + ' (' + Math.floor(dur/60) + 'm ' + (dur%60) + 's). No CallRail summary available for this call.';
  } else {
    var sents = raw.split('. ').filter(function(s){ return s.trim().length > 15; });
    summary = sents.slice(0,2).join('. ').trim();
    if (summary && !summary.match(/[.!?]$/)) summary += '.';
  }

  // ── AGENT NOTES ──────────────────────────────────────────────────────────
  var agent_notes;
  if (!call.answered) {
    agent_notes = 'Call not answered — went to voicemail.';
  } else if (!hasText) {
    agent_notes = 'No call summary available — cannot assess agent performance. Review recording directly.';
  } else if (outcome === 'New Appointment Booked') {
    agent_notes = /confirmed.*insurance|verified.*insurance/i.test(txt)
      ? 'Agent confirmed insurance and secured the appointment — strong handling.'
      : 'Agent successfully converted the inquiry to a booked appointment.';
  } else if (lost_reason === 'Insurance Not Accepted' && !/self.pay|payment.plan/i.test(txt)) {
    agent_notes = 'Agent communicated the insurance policy correctly but did not offer a self-pay or payment plan alternative — standard recovery script needed.';
  } else if (urgency === 'Emergency' || urgency === 'High') {
    agent_notes = 'High-urgency caller was not booked — agent should have prioritized an immediate slot or escalated to the doctor for a same-day assessment.';
  } else if (dur < 60 && call.answered) {
    agent_notes = 'Call ended in under 60 seconds — too brief to fully qualify the caller or make a booking attempt.';
  } else {
    agent_notes = 'Agent engaged but did not secure an appointment — review summary for specific closing opportunity.';
  }

  // ── DRIVERS ──────────────────────────────────────────────────────────────
  var booked_driver = null, lost_driver = null;
  if (outcome === 'New Appointment Booked' || outcome === 'Rescheduled') {
    if (urgency === 'Emergency' || urgency === 'High') booked_driver = 'Patient urgency created immediate scheduling need — agent responded appropriately';
    else if (/confirmed.*insurance|insurance.*in.network/i.test(txt)) booked_driver = 'Insurance confirmed in-network — key objection removed before closing';
    else booked_driver = 'Agent effectively qualified the patient need and guided to an appointment';
  } else if (outcome !== 'Missed / No Answer') {
    if (lost_reason === 'Insurance Not Accepted') lost_driver = 'Insurance not accepted — no self-pay alternative was presented to bridge the gap';
    else if (lost_reason === 'Insurance Out Of Network') lost_driver = 'Practice is out-of-network for patient\'s plan — out-of-pocket cost not addressed';
    else if (lost_reason === 'Schedule No Fit') lost_driver = 'No available slot matched patient timing or urgency — operational scheduling gap';
    else if (lost_reason === 'Voicemail No Human') lost_driver = 'No live agent answered the call';
    else if (lost_reason === 'Callback Needed') lost_driver = 'Patient not ready to commit — no appointment hold secured to maintain momentum';
    else if (lost_reason === 'Unclassified Short Call') lost_driver = 'Call ended before qualifying conversation could begin';
    else lost_driver = 'Based on the summary, the patient need was not matched or agent did not attempt to close';
  }

  return {
    outcome: outcome, procedure: procedure, urgency: urgency,
    lead_quality: lead_quality, lead_score: lead_score, sentiment: sentiment,
    agent_score: agent_score, agent_notes: agent_notes, summary: summary,
    lost_reason: lost_reason, ops_opportunity: ops_opportunity,
    flag_priority: flag_priority, flag_type: flag_type,
    booked_driver: booked_driver, lost_driver: lost_driver,
    has_summary: hasText
  };
}


function dismissProg(){ document.getElementById("progBanner").style.display="none"; }
function showProgress(done, total, failed){
  var el = document.getElementById('progBanner');
  el.style.display = 'flex';
  var pct = total ? Math.round(done/total*100) : 0;
  el.innerHTML = '<div><strong>Analyzing…</strong> ' + done + ' / ' + total + ' done' +
    (failed ? ' · <span style="color:#F09595">' + failed + ' failed</span>' : '') + '</div>' +
    '<div style="width:160px;height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden">' +
    '<div style="width:' + pct + '%;height:100%;background:var(--accent);border-radius:3px"></div></div>';
}

function hideProgress(done, failed){
  var el = document.getElementById('progBanner');
  el.style.background = failed ? '#7f1d1d' : '#0f6e56';
  el.innerHTML = (failed ? '⚠ ' + done + ' analyzed, ' + failed + ' failed' : '✓ ' + done + ' calls analyzed — charts updated') +
    ' <button onclick="dismissProg()" style="background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:11px;margin-left:12px">Dismiss</button>';
  setTimeout(function(){ el.style.display='none'; }, 6000);
}

async function analyzeAll(){
  var btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  var todo = calls.filter(function(c){ return !cache[c.id]; });
  if(!todo.length){ btn.disabled=false; return; }
  showProgress(0, todo.length, 0);
  todo.forEach(function(c){ cache[c.id] = analyzeLocally(c); });
  hideProgress(todo.length, 0);
  btn.textContent = '+ Analyze all';
  btn.disabled = false;
  render();
}

async function analyzeOne(id){
  var c = calls.find(function(x){ return x.id == id; });
  if(!c) return;
  var res = document.getElementById('ar-' + id);
  var btn = document.getElementById('ab-' + id);
  if(res) res.innerHTML = '<div class="aia"><div class="mspin"></div>Analyzing…</div>';
  await new Promise(function(r){ setTimeout(r, 150); });
  cache[id] = analyzeLocally(c);
  if(res) res.innerHTML = aiResult(cache[id]);
  if(btn){ btn.disabled=false; btn.textContent='↺ Re-analyze'; }
  render();
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function sc(s){ return s>=75?'#1D9E75':s>=55?'#BA7517':'#E24B4A'; }
function pct(a,b){ return b?Math.round(a/b*100):0; }
function fmt(s){ return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'; }
function isLSA(c){ return (c.source_name||'').toLowerCase().includes('local service'); }
function ai(){ return calls.map(function(c){ return cache[c.id]; }).filter(Boolean); }

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){ renderKpis(); renderCharts(); renderCalls(); renderOps(); }

function renderKpis(){
  var a=ai(), t=calls.length, ans=calls.filter(function(c){return c.answered;}).length;
  var bk=a.filter(function(x){return x.outcome==='New Appointment Booked';}).length;
  var ag=a.length?Math.round(a.reduce(function(s,x){return s+(x.agent_score||0);},0)/a.length):null;
  var ld=a.length?Math.round(a.reduce(function(s,x){return s+(x.lead_score||0);},0)/a.length):null;
  var dur=t?Math.round(calls.reduce(function(s,c){return s+(c.duration||0);},0)/t):0;
  document.getElementById('kstrip').innerHTML=
    '<div class="kcard acc"><div class="kval" style="color:var(--accent)">'+t+'</div><div class="klbl">Total calls</div><div class="ksub">Google Ads + LSA</div></div>'+
    '<div class="kcard"><div class="kval">'+pct(ans,t)+'%</div><div class="klbl">Answer rate</div><div class="ksub">'+ans+' answered</div></div>'+
    '<div class="kcard"><div class="kval" style="color:'+(a.length?sc(pct(bk,a.length)):'var(--muted)')+'">'+
      (a.length?pct(bk,a.length)+'%':'--')+'</div><div class="klbl">Booking rate</div><div class="ksub">'+(a.length?bk+' booked / '+a.length+' analyzed':'Click Analyze all')+'</div></div>'+
    '<div class="kcard"><div class="kval">'+fmt(dur)+'</div><div class="klbl">Avg duration</div><div class="ksub">'+calls.filter(function(c){return c._txt;}).length+' with summaries</div></div>'+
    '<div class="kcard"><div class="kval" style="color:'+(ag?sc(ag):'var(--muted)')+'">'+
      (ag!=null?ag:'--')+'</div><div class="klbl">Avg agent score</div><div class="ksub">'+(ld!=null?'Lead avg: '+ld:'Click Analyze all')+'</div></div>';
}

function sd(k){ try{if(ch[k]){ch[k].destroy();delete ch[k];}}catch(e){} }
function renderCharts(){
  ['oc','pr','lo','sr','lq','ur'].forEach(sd);
  var a=ai(), lsa=calls.filter(isLSA).length, ads=calls.length-lsa;
  var oc={},pr={},lo={},lq={hot:0,warm:0,cold:0},ur={};
  a.forEach(function(x){
    if(x.outcome) oc[x.outcome]=(oc[x.outcome]||0)+1;
    if(x.procedure&&x.procedure!=='Unknown') pr[x.procedure]=(pr[x.procedure]||0)+1;
    if(x.lost_reason&&x.outcome!=='New Appointment Booked') lo[x.lost_reason]=(lo[x.lost_reason]||0)+1;
    if(x.lead_quality&&lq[x.lead_quality]!==undefined) lq[x.lead_quality]++;
    if(x.urgency) ur[x.urgency]=(ur[x.urgency]||0)+1;
  });
  var OC={'New Appointment Booked':'#1D9E75','Not Booked':'#E24B4A','Referred Out':'#BA7517','Confirmed Existing':'#185FA5','Missed / No Answer':'#888780','Cancelled':'#D4537E','Rescheduled':'#3b82f6'};
  var ph='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:11px;text-align:center">Run Analyze all<br>to populate</div>';
  document.getElementById('cr1').innerHTML=

function cleanLeadExplanation(raw) {
  if(!raw) return '';
  // Remove scoring references: "(23 points)", "(23 points).", "23/25 for Need"
  var text = raw
    .replace(/\(\d+\s*\/\s*\d+\s*(?:points?)?\)/gi, '')
    .replace(/\(\d+\s*points?\)/gi, '')
    .replace(/\d+\s*\/\s*25\s+for\s+\w+/gi, '')
    .replace(/\(\s*\d+\s*\)/g, '')
    .replace(/\s{2,}/g, ' ')
    .replace(/\.\s*\./g, '.')
    .trim();

  // Clean up dangling punctuation from removals
  text = text.replace(/—\s*\./g, '.').replace(/,\s*\./g, '.').replace(/;\s*\./g, '.');

  // Split into sentences, remove very short/empty ones, rejoin cleanly
  var sentences = text.split(/(?<=[.!?])\s+/).map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length > 15; });

  return sentences.join(' ');
}

function buildCallCard(c) {
  var dt   = c.start_time ? new Date(c.start_time) : null;
  var date = dt ? dt.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}) : '--';
  var time = dt ? dt.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) : '';
  var name  = c.customer_name || 'Unknown';
  var phone = c.customer_phone_number || '';
  var dur   = fmt(c.duration || 0);
  var lsa   = isLSA(c);
  var x     = cache[c.id];

  var OC = {
    'New Appointment Booked':'#1D9E75', 'Not Booked':'#E24B4A', 'Referred Out':'#BA7517',
    'Confirmed Existing':'#185FA5', 'Missed / No Answer':'#888780',
    'Cancelled':'#D4537E', 'Rescheduled':'#3b82f6'
  };
  var LQ   = {hot:'#1D9E75', warm:'#BA7517', cold:'#888780'};
  var urgC = {Emergency:'#E24B4A', High:'#BA7517', Normal:'#185FA5', Low:'#888780'};

  // Border color by outcome
  var borderCol = '#e2e0d9';
  if (x) {
    if (x.outcome === 'New Appointment Booked' || x.outcome === 'Rescheduled') borderCol = '#1D9E75';
    else if (x.outcome === 'Missed / No Answer') borderCol = '#9c9890';
    else if (x.outcome === 'Referred Out')        borderCol = '#BA7517';
    else                                           borderCol = '#E24B4A';
  }

  var asc  = x ? (x.agent_score || 0) : null;
  var lsc  = x ? (x.lead_score  || 0) : null;
  var ascC = asc !== null ? sc(asc) : '#9c9890';
  var lscC = lsc !== null ? sc(lsc) : '#9c9890';

  // ── Transcript — always present ──────────────────────────────────────────
  var txHtml;
  // Detect scoring-style text (lead_explanation) vs narrative summary
  var isScoringText = c._txt && /\d+\/25/.test(c._txt);
  var txLabel = c._fieldUsed && !isScoringText
    ? 'CallRail summary'
    : isScoringText
      ? 'CallRail lead explanation (loading full summary...)'
      : 'CallRail summary / transcript';
  if (c._txt) {
    var displayText = cleanLeadExplanation(c._txt);
    txHtml = '<div class="transcript-box" id="tx-' + c.id + '">'
           +   '<div class="txlbl" style="display:flex;justify-content:space-between;align-items:center">'
           +     '<span>CallRail call summary</span>'
           +     '<span style="font-size:9px;color:#9c9890;font-weight:400;font-style:normal">via lead_explanation field</span>'
           +   '</div>'
           +   '<div class="txtext">' + displayText + '</div>'
           + '</div>';
  } else if (c._summaryFetched) {
    txHtml = '<div class="transcript-box" id="tx-' + c.id + '" style="background:#fff8e1;border:1px solid rgba(186,117,23,.2)">'  
           +   '<div class="txlbl" style="color:#BA7517">No transcript available</div>'
           +   '<div class="txtext" style="color:#92400e;font-style:italic">CallRail returned no transcript or summary for this call. Check the recording in CallRail directly.</div>'
           + '</div>';
  } else {
    txHtml = '<div class="transcript-box" id="tx-' + c.id + '" style="opacity:.6">'
           +   '<div class="txlbl" style="color:#9c9890">Loading transcript...</div>'
           +   '<div class="txtext" style="font-style:italic;color:#9c9890">Fetching from CallRail...</div>'
           + '</div>';
  }

  // ── Analysis pills ───────────────────────────────────────────────────────
  var aRow = '';
  if (x) {
    aRow = '<div class="analysis-row">'
         +   '<div class="an-cell"><div class="an-lbl">Procedure</div><div class="an-val" style="font-size:10px">' + (x.procedure || '--') + '</div></div>'
         +   '<div class="an-cell"><div class="an-lbl">Urgency</div><div class="an-val" style="color:' + (urgC[x.urgency] || '#888') + '">' + (x.urgency || '--') + '</div></div>'
         +   '<div class="an-cell"><div class="an-lbl">Lead quality</div><div class="an-val" style="color:' + (LQ[x.lead_quality] || '#888') + '">' + (x.lead_quality ? x.lead_quality.toUpperCase() : '--') + '</div></div>'
         +   '<div class="an-cell"><div class="an-lbl">Sentiment</div><div class="an-val">' + (x.sentiment || '--') + '</div></div>'
         +   '<div class="an-cell"><div class="an-lbl">Lost reason</div><div class="an-val" style="font-size:9px;color:' + (x.lost_reason ? '#E24B4A' : '#9c9890') + '">' + (x.lost_reason || '--') + '</div></div>'
         +   '<div class="an-cell"><div class="an-lbl">Outcome</div><div class="an-val" style="font-size:9px;color:' + (OC[x.outcome] || '#888') + '">' + (x.outcome || '--') + '</div></div>'
         + '</div>';
  }

  // ── Score bar builder ────────────────────────────────────────────────────
  function bar(score, col, lbl) {
    return '<div class="score-bar-card">'
         +   '<div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9c9890;margin-bottom:4px">' + lbl + '</div>'
         +   '<div class="sbarw">'
         +     '<div class="sbart"><div class="sbarf" style="width:' + score + '%;background:' + col + '"></div></div>'
         +     '<span style="font-size:12px;font-weight:700;color:' + col + ';min-width:36px">' + score + '/100</span>'
         +   '</div>'
         + '</div>';
  }

  // ── Coaching / driver box ────────────────────────────────────────────────
  var coachHtml = '';
  if (x) {
    var bk = x.outcome === 'New Appointment Booked' || x.outcome === 'Rescheduled';
    if (bk && x.booked_driver) {
      coachHtml = '<div class="coaching-card green">'
                +   '<div class="coaching-hdr green">What closed the booking</div>'
                +   '<div class="coaching-txt green">' + x.booked_driver + '</div>'
                + '</div>';
    } else if (x.ops_opportunity && x.ops_opportunity !== 'null') {
      var fp = x.flag_priority;
      var fcol = fp === 'high' ? '#E24B4A' : fp === 'medium' ? '#BA7517' : '#9c9890';
      coachHtml = '<div class="coaching-card">'
                +   '<div class="coaching-hdr">'
                +     (fp ? '<span style="color:' + fcol + ';margin-right:5px">' + fp.toUpperCase() + '</span>' : '')
                +     'Coaching opportunity</div>'
                +   '<div class="coaching-txt">' + x.ops_opportunity + '</div>'
                + '</div>';
    } else if (x.lost_driver) {
      coachHtml = '<div class="coaching-card">'
                +   '<div class="coaching-hdr">Why we lost it</div>'
                +   '<div class="coaching-txt">' + x.lost_driver + '</div>'
                + '</div>';
    }
  }

  // ── Front desk note ──────────────────────────────────────────────────────
  var fdHtml = '';
  if (x && x.agent_notes) {
    fdHtml = '<div style="padding:0 16px 12px">'
           +   '<div style="background:#f9f8f5;border-radius:7px;padding:8px 12px;border-left:3px solid ' + sc(asc || 0) + '">'

           +   '</div>'

  // ── Scores + coaching row ────────────────────────────────────────────────
  var scRow = '';
  if (x) {

          +   bar(asc, ascC, 'Agent score')
          +   bar(lsc, lscC, 'Lead score')
          +   coachHtml
          + '</div>';
  }

  // ── Analyze button bar ───────────────────────────────────────────────────
  var btnLabel = x ? '&#8635; Re-analyze' : '&#10010; Analyze call';
  var analyzeBar = '<div class="analyze-bar">';
  if (c.answered) {
    analyzeBar += '<button class="banal" id="ab-' + c.id + '" onclick="analyzeOne(this.closest(\'[data-cid]\').dataset.cid)" style="font-size:11px;padding:.3rem .75rem">' + btnLabel + '</button>';
  } else {

  }
  if (x) {
    analyzeBar += '<span style="font-size:11px;color:#9c9890;margin-left:auto">Analyzed from CallRail summary</span>';
  }
  analyzeBar += '</div>';

  // ── Outcome pill for info column ─────────────────────────────────────────

                +   '<div class="ip-label">Outcome</div>'
                +   '<div class="ip-val" style="color:' + (OC[x.outcome] || '#1a1917') + ';font-weight:700">' + (x.outcome || '--') + '</div>'

  // ── Assemble card ────────────────────────────────────────────────────────
  var html = '<div class="call-card" id="r-' + c.id + '" data-cid="' + c.id + '" style="border-left-color:' + borderCol + '">';

  // Header
  html += '<div class="call-card-header">';
  html +=   '<div>';
  html +=     '<div class="caller-name">' + name + '</div>';
  if (phone) {
    html +=   '<div style="font-size:11px;font-weight:600;color:#6b6963;margin-bottom:3px">&#9990;&nbsp;' + phone + '</div>';
  }
  html +=     '<div class="caller-meta">';
  html +=       '<span>' + date + ' &middot; ' + time + '</span>';
  html +=       '<span><span class="sb ' + (lsa ? 'slsa' : 'sads') + '">' + (lsa ? 'LSA' : 'Google Ads') + '</span></span>';

  html +=       (c.answered ? '<span class="ab ayes">Answered</span>' : '<span class="ab ano">Missed</span>');

    '<div class="agrid">'+
      '<div class="acell"><div class="albl">Outcome</div><div class="aval" style="color:'+(OC[x.outcome]||'var(--muted)')+';font-size:11px">'+(x.outcome||'--')+'</div></div>'+
      '<div class="acell"><div class="albl">Procedure</div><div class="aval" style="font-size:11px">'+(x.procedure||'--')+'</div></div>'+
      '<div class="acell"><div class="albl">Urgency</div><div class="aval" style="font-size:11px">'+(x.urgency||'--')+'</div></div>'+
      '<div class="acell"><div class="albl">Lead quality</div><div class="aval" style="color:'+(LQ[x.lead_quality]||'var(--muted)')+';font-weight:700">'+(x.lead_quality?x.lead_quality.toUpperCase():'--')+'</div></div>'+
      '<div class="acell"><div class="albl">Sentiment</div><div class="aval">'+(x.sentiment||'--')+'</div></div>'+
      '<div class="acell"><div class="albl">Lost reason</div><div class="aval" style="font-size:10px;color:'+(x.lost_reason?'var(--red)':'var(--muted)')+'">'+( x.lost_reason||'--')+'</div></div>'+
    '</div>'+
    '<div class="dgrid">'+
      '<div class="dbox"><div class="dlbl">Agent score</div>'+bar(x.agent_score||0,sc(x.agent_score||0))+'</div>'+
      '<div class="dbox"><div class="dlbl">Lead score</div>'+bar(x.lead_score||0,sc(x.lead_score||0))+'</div>'+
    '</div>'+
    '<div class="sbox"><div class="dlbl">AI summary</div><div class="dtxt">'+(x.summary||'')+'</div></div>'+
    (x.agent_notes?'<div class="dbox" style="border-left:3px solid '+sc(x.agent_score||0)+'"><div class="dlbl">Front desk</div><div class="dtxt">'+x.agent_notes+'</div></div>':'')+
    (bk&&x.booked_driver?'<div class="drvbox" style="background:#e8f5ee;border-color:#1D9E75"><div class="dlbl" style="color:#0f6e56">What closed it</div><div class="dtxt">'+x.booked_driver+'</div></div>':'')+
    (!bk&&x.lost_driver?'<div class="drvbox" style="background:var(--red-lt);border-color:var(--red)"><div class="dlbl" style="color:#a32d2d">Why we lost it</div><div class="dtxt">'+x.lost_driver+'</div></div>':'')+
    (x.ops_opportunity&&x.ops_opportunity!=='null'?'<div class="obox"><div class="olbl">Coaching opportunity</div><div class="dtxt">'+x.ops_opportunity+'</div></div>':'')+
  '</div>';
}

function renderOps(){
  var a=ai();
  var flagged=calls.filter(function(c){return cache[c.id]&&cache[c.id].flag_priority;});
  var highF=flagged.filter(function(c){return cache[c.id].flag_priority==='high';});
  var medF =flagged.filter(function(c){return cache[c.id].flag_priority==='medium';});
  var lowF =flagged.filter(function(c){return cache[c.id].flag_priority==='low';});
  document.getElementById('okstrip').innerHTML=
    '<div class="kcard acc"><div class="kval" style="color:var(--accent)">'+flagged.length+'</div><div class="klbl">Coaching flags</div><div class="ksub">'+highF.length+' high / '+medF.length+' medium / '+lowF.length+' low</div></div>'+
    '<div class="kcard"><div class="kval" style="color:var(--red)">'+highF.length+'</div><div class="klbl">High priority</div><div class="ksub">Urgent or warm lead lost</div></div>'+
    '<div class="kcard"><div class="kval">'+(a.length?Math.round(flagged.length/a.length*100):0)+'%</div><div class="klbl">Flag rate</div><div class="ksub">Of '+a.length+' analyzed</div></div>';
  if(!flagged.length){document.getElementById('opslist').innerHTML=a.length?'<div class="empt">No coaching flags detected.</div>':'<div class="empt">Click Analyze all first.</div>';return;}
  var pcol={high:'#E24B4A',medium:'#BA7517',low:'#9ca3af'};
  var sorted=flagged.slice().sort(function(a,b){var o={high:0,medium:1,low:2};return o[cache[a.id].flag_priority]-o[cache[b.id].flag_priority];});
  document.getElementById('opslist').innerHTML=sorted.map(function(c){
    var x=cache[c.id];
    var name=c.customer_name||'Unknown';
    var phone=c.customer_phone_number||'';
    var dt=c.start_time?new Date(c.start_time).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'--';
    var col=pcol[x.flag_priority]||'#888';
    var asc=x.agent_score||0, acol=asc>=75?'#1D9E75':asc>=55?'#BA7517':'#E24B4A';
    var plabel=x.flag_priority==='high'?'HIGH':x.flag_priority==='medium'?'MEDIUM':'LOW';
    return '<div class="opsc" style="border-left:4px solid '+col+'">'+
      '<div style="flex-shrink:0;min-width:60px;padding-top:2px"><span style="font-size:10px;font-weight:800;color:'+col+'">'+plabel+'</span></div>'+
      '<div style="flex:1">'+
        '<div style="font-size:13px;font-weight:700;margin-bottom:1px">'+name+'</div>'+(phone?'<div style="font-size:11px;color:#6b6963;margin-bottom:3px">☎ '+phone+'</div>':'')+
        '<div style="font-size:11px;font-weight:600;color:'+col+';margin-bottom:5px">'+(x.flag_type||'')+'</div>'+
        '<div style="font-size:12px;color:var(--muted);line-height:1.6">'+(x.ops_opportunity||'')+'</div>'+
        '<div style="font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap">'+
          '<span>'+dt+'</span><span>Agent: <strong style="color:'+acol+'">'+asc+'/100</strong></span>'+
          '<span>'+(x.outcome||'')+'</span><span>'+(x.lost_reason||'')+'</span>'+
          '<span>'+(c.source_name||'')+'</span><span>Lead: '+(x.lead_score||0)+'/100</span>'+
        '</div></div></div>';
  }).join('');
}

function showView(n,btn){
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('view-'+n).classList.add('active');
}

async function refreshDash(){
  cache = {};
  document.getElementById('main').style.display    = 'none';
  document.getElementById('loading').style.display = 'flex';
  try { await loadCalls(); render(); } catch(e) { console.error(e); }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display    = 'block';
}


// ── EXPORT REPORT ──────────────────────────────────────────────────────────

function savePDF() {
  // Show a brief overlay so the user knows what's happening
  var overlay = document.createElement('div');
  overlay.id = 'pdf-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:inherit';
  overlay.innerHTML = '<div style="background:#fff;border-radius:12px;padding:2rem 2.5rem;max-width:420px;text-align:center">' +
    '<div style="font-size:24px;margin-bottom:1rem">🖨</div>' +
    '<div style="font-size:16px;font-weight:700;margin-bottom:.5rem">Save as PDF</div>' +
    '<div style="font-size:13px;color:#6b6963;line-height:1.6;margin-bottom:1.25rem">' +
      'The print dialog will open.<br>' +
      '<strong>Change destination to "Save as PDF"</strong><br>' +
      'then click Save.' +
    '</div>' +
    '<div style="font-size:11px;color:#9c9890">Tip: set Layout to Landscape for wider charts.</div>' +
    '</div>';
  document.body.appendChild(overlay);
  setTimeout(function() {
    overlay.remove();
    window.print();
  }, 1800);
}


// ── AUTO-LAUNCH ───────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async function(){
  // Step 1: load calls
  try {
    await loadCalls();
  } catch(e) {
    console.error('[OM] loadCalls failed:', e);
    document.getElementById('lmsg').textContent = 'Load failed: ' + e.message;
    document.getElementById('lsub').textContent = 'Check that your API key is valid and try refreshing.';
    document.getElementById('lbar').style.background = '#E24B4A';
    document.getElementById('lbar').style.width = '100%';
    return;
  }

  // Step 2: render cards and show dashboard
  try { render(); } catch(e){ console.error('[OM] render failed:', e); }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display    = 'block';

  // Step 3: run local analysis on all calls
  try {
    var btn = document.getElementById('analyzeBtn');
    if(btn) btn.disabled = true;
    calls.forEach(function(c){ cache[c.id] = analyzeLocally(c); });
    if(btn){ btn.disabled = false; btn.textContent = '+ Analyze all'; }
    render();
    console.log('[OM] Auto-analyze complete:', Object.keys(cache).length, 'calls analyzed');
  } catch(e) {
    console.error('[OM] analyzeAll failed:', e);
  }

  // Step 4: start background transcription (non-blocking)
  try {
    enrichTranscripts(calls);
  } catch(e) {
    console.error('[OM] enrichTranscripts failed:', e);
  }
});
</script>
